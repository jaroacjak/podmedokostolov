<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poďme do kostolov</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #29251f;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 560px;
    }

    .logo {
      font-size: 56px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 16px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #716b63;
      margin: 0;
    }

    .status {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 18px;
      border-radius: 999px;
      background: #e8e1d5;
      color: #6d5a42;
      font-size: 14px;
    }

    .refresh-btn {
      margin-top: 24px;
      padding: 13px 24px;
      border: none;
      border-radius: 8px;
      background: #6d5a42;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #51422f;
    }

    .refresh-btn:focus-visible {
      outline: 3px solid #b8a58b;
      outline-offset: 3px;
    }

    footer {
      margin-top: 48px;
      font-size: 13px;
      color: #aaa39a;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo" aria-hidden="true">⛪</div>

    <h1>Poďme do kostolov</h1>

    <p>
      Stránka je dočasne nedostupná.
      <br>
      Momentálne prebieha údržba.
    </p>

    <div class="status">Čoskoro budeme späť</div>

    <br>

    <button class="refresh-btn" onclick="location.reload()">
      ↻ Obnoviť stránku
    </button>

    <footer>
      Ďakujeme za pochopenie.
    </footer>
  </main>
</body>
</html>
