<!DOCTYPE html><html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrácia – Poďme do kostolov</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #29251f;
    }

    header {
      background: #6d5a42;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px #0000000d;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 16px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .primary,
    .secondary,
    .delete {
      padding: 11px 16px;
      border: none;
      border-radius: 7px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      margin-top: 20px;
      background: #6d5a42;
    }

    .primary:hover {
      background: #51422f;
    }

    .secondary {
      background: #777;
    }

    .delete {
      background: #9b3d3d;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .notice {
      background: #f8f6f2;
      border-left: 4px solid #6d5a42;
      padding: 16px;
      margin-bottom: 15px;
      border-radius: 0 8px 8px 0;
    }

    .notice h3 {
      margin: 0 0 8px;
    }

    .notice p {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .notice-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 6px;
    }

    #stav {
      margin-top: 15px;
      font-weight: bold;
    }

    .empty {
      color: #777;
    }

    a {
      color: #6d5a42;
    }
  </style></head><body><header>
  <h1>Administrácia</h1>
  <p>Poďme do kostolov</p>
</header><main class="container">  <section class="card"><h2 id="formTitle">
  Pridať farský oznam
</h2>

<form id="oznamForm">

  <label for="farnost">
    Farnosť
  </label>

  <select id="farnost" required>

    <option value="bytca">
      Farnosť Bytča
    </option>

  </select>


  <label for="datum">
    Dátum
  </label>

  <input
    id="datum"
    type="date"
    required
  >


  <label for="nadpis">
    Nadpis
  </label>

  <input
    id="nadpis"
    type="text"
    placeholder="Nadpis farského oznamu"
    required
  >


  <label for="text">
    Text oznamu
  </label>

  <textarea
    id="text"
    placeholder="Napíšte farský oznam..."
    required
  ></textarea>


  <button
    class="primary"
    type="submit"
    id="ulozit"
  >
    Pridať oznam
  </button>


  <button
    class="secondary"
    type="button"
    id="zrusit"
    style="display:none;"
  >
    Zrušiť úpravu
  </button>


  <div id="stav"></div>

</form>

  </section>  <section class="card"><h2>
  Oznamy
</h2>

<div id="zoznam">
  Načítavam...
</div>

  </section>  <p>
    <a href="index.html">
      ← Späť na hlavnú stránku
    </a>
  </p></main><script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCrOukMV3UaA6qzkBTijwybzoLEu4cXJMU",

  authDomain:
    "podmedokostolov-f21a0.firebaseapp.com",

  projectId:
    "podmedokostolov-f21a0",

  storageBucket:
    "podmedokostolov-f21a0.firebasestorage.app",

  messagingSenderId:
    "555695024153",

  appId:
    "1:555695024153:web:e7b142d468b4d444e6e288",

  measurementId:
    "G-Q4MHYP66N7"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


const form =
  document.getElementById("oznamForm");

const farnost =
  document.getElementById("farnost");

const datum =
  document.getElementById("datum");

const nadpis =
  document.getElementById("nadpis");

const text =
  document.getElementById("text");

const ulozit =
  document.getElementById("ulozit");

const zrusit =
  document.getElementById("zrusit");

const stav =
  document.getElementById("stav");

const zoznam =
  document.getElementById("zoznam");

const formTitle =
  document.getElementById("formTitle");


let upravovanyId = null;


/*
  OZNAMY SA AUTOMATICKY
  AKTUALIZUJÚ AJ V ADMINISTRÁCII.
*/

onSnapshot(
  collection(db, "oznamy"),

  (snapshot) => {

    const oznamy = [];


    snapshot.forEach(
      (item) => {

        oznamy.push({
          id: item.id,
          ...item.data()
        });

      }
    );


    oznamy.sort(
      (a, b) =>
        (b.datum || "")
          .localeCompare(
            a.datum || ""
          )
    );


    vykresliOznamy(
      oznamy
    );

  },

  (error) => {

    console.error(error);

    zoznam.textContent =
      "Oznamy sa nepodarilo načítať.";

  }
);


/*
  VYKRESLENIE
*/

function vykresliOznamy(
  oznamy
) {

  zoznam.replaceChildren();


  if (oznamy.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "Zatiaľ nie sú pridané žiadne oznamy.";

    zoznam.appendChild(
      empty
    );

    return;
  }


  oznamy.forEach(
    (oznam) => {

      const article =
        document.createElement("article");

      article.className =
        "notice";


      const title =
        document.createElement("h3");

      title.textContent =
        oznam.nadpis ||
        "Farský oznam";


      const date =
        document.createElement("div");

      date.className =
        "notice-date";

      date.textContent =
        "Po – " +
        peknyDatum(
          oznam.datum
        );


      const parish =
        document.createElement("div");

      parish.className =
        "notice-date";

      parish.textContent =
        "Farnosť: " +
        (
          oznam.farnost === "bytca"
            ? "Farnosť Bytča"
            : oznam.farnost || ""
        );


      const content =
        document.createElement("p");

      content.textContent =
        oznam.text || "";


      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      const edit =
        document.createElement("button");

      edit.className =
        "secondary";

      edit.textContent =
        "✎ Upraviť";

      edit.addEventListener(
        "click",
        () => upravOznam(
          oznam
        )
      );


      const remove =
        document.createElement("button");

      remove.className =
        "delete";

      remove.textContent =
        "🗑 Vymazať";

      remove.addEventListener(
        "click",
        () => vymazOznam(
          oznam.id
        )
      );


      actions.append(
        edit,
        remove
      );


      article.append(
        title,
        date,
        parish,
        content,
        actions
      );


      zoznam.appendChild(
        article
      );

    }
  );

}


/*
  PRIDAŤ / UPRAVIŤ
*/

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    ulozit.disabled = true;

    stav.textContent =
      "Ukladám...";


    try {

      const data = {

        farnost:
          farnost.value,

        datum:
          datum.value,

        nadpis:
          nadpis.value.trim(),

        text:
          text.value.trim(),

        updatedAt:
          serverTimestamp()

      };


      if (upravovanyId) {

        await updateDoc(
          doc(
            db,
            "oznamy",
            upravovanyId
          ),
          data
        );


        stav.textContent =
          "✓ Oznam bol upravený.";

      } else {

        await addDoc(
          collection(
            db,
            "oznamy"
          ),
          {
            ...data,
            createdAt:
              serverTimestamp()
          }
        );


        stav.textContent =
          "✓ Oznam bol pridaný.";

      }


      zrusUpravu();


    } catch (error) {

      console.error(error);

      stav.textContent =
        "Operácia sa nepodarila.";

    } finally {

      ulozit.disabled =
        false;

    }

  }
);


/*
  UPRAVIŤ
*/

function upravOznam(
  oznam
) {

  upravovanyId =
    oznam.id;


  farnost.value =
    oznam.farnost ||
    "bytca";

  datum.value =
    oznam.datum ||
    "";

  nadpis.value =
    oznam.nadpis ||
    "";

  text.value =
    oznam.text ||
    "";


  formTitle.textContent =
    "Upraviť farský oznam";

  ulozit.textContent =
    "Uložiť zmeny";

  zrusit.style.display =
    "inline-block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/*
  ZRUŠIŤ ÚPRAVU
*/

function zrusUpravu() {

  upravovanyId =
    null;

  form.reset();


  formTitle.textContent =
    "Pridať farský oznam";

  ulozit.textContent =
    "Pridať oznam";

  zrusit.style.display =
    "none";

}


zrusit.addEventListener(
  "click",
  zrusUpravu
);


/*
  VYMAZAŤ
*/

async function vymazOznam(
  id
) {

  if (
    !confirm(
      "Naozaj chcete tento oznam vymazať?"
    )
  ) {
    return;
  }


  try {

    await deleteDoc(
      doc(
        db,
        "oznamy",
        id
      )
    );


    stav.textContent =
      "✓ Oznam bol vymazaný.";

  } catch (error) {

    console.error(error);

    stav.textContent =
      "Oznam sa nepodarilo vymazať.";

  }

}


/*
  DÁTUM
*/

function peknyDatum(
  datum
) {

  if (!datum) {
    return "";
  }

  return new Date(
    datum + "T00:00:00"
  ).toLocaleDateString(
    "sk-SK",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );

}

</script></body>
</html>
